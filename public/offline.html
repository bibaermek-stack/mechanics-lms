<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070f">
  <title>Интернет жоқ — Механика AI</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
      background: radial-gradient(ellipse 80% 60% at 50% 30%, rgba(51,102,255,.25), transparent 70%), #05070f;
      color: #e2e8f0; font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; text-align: center;
    }
    main { max-width: 26rem; }
    .mark {
      width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #3366ff, #6d5cf6 55%, #22a5ee);
      font-size: 40px; font-weight: 800; color: #fff;
    }
    h1 { margin: 0 0 8px; font-size: 1.5rem; color: #fff; }
    p { margin: 0 0 20px; line-height: 1.55; color: #94a3b8; }
    button {
      font: inherit; font-weight: 600; color: #fff; cursor: pointer;
      min-height: 44px; padding: 10px 22px; border: 0; border-radius: 14px;
      background: linear-gradient(120deg, #3366ff, #6d5cf6 55%, #22a5ee);
    }
    button:focus-visible { outline: 3px solid #8fb4ff; outline-offset: 3px; }
    small { display: block; margin-top: 18px; color: #64748b; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">М</div>
    <h1>Интернет байланысы жоқ</h1>
    <p>Бұл бетті әлі ашпағансыз, сондықтан құрылғыда сақталмаған. Байланыс қайта пайда болғанда ол өзі ашылады.
       Бұрын ашқан беттеріңіз интернетсіз де көрінеді.</p>
    <button type="button" onclick="location.reload()">Қайта көру</button>
    <small>Сабақ бейнелері мен жаңа нәтижелерді жүктеу үшін интернет қажет.</small>
  </main>
  <script>
    // Reload by itself the moment the connection returns.
    addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
